name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
      - run: uvx ruff@0.16.8 check .
      - run: uvx ruff@0.16.8 format --check .

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [services/tournament-service, services/scraper, services/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    # Base MySQL jetable pour les tests (mêmes valeurs que les défauts de tests/conftest.py).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: tournament_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
      - run: uv sync --frozen
      - run: uv run pytest
      - run: docker build .
