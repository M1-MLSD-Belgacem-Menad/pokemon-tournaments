name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
      - run: uvx ruff@0.16.8 check .
      - run: uvx ruff@0.16.8 format --check .
      - run: kubectl kustomize k8s > /dev/null  # manifestes Kubernetes bien formés

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [services/tournament-service, services/user-service, services/scraper, services/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    # Base MySQL jetable pour les tests (mêmes valeurs que les défauts de tests/conftest.py).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: tournament_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
      - run: uv sync --frozen
      - run: uv run pytest
      - run: docker build .

  # Au push d'un tag v* (ex. v0.1.0), une fois lint et tests verts : publie <compte>/pokemon-<service>:0.1.0.
  # Secrets GitHub à créer : DOCKERHUB_USERNAME (en minuscules) et DOCKERHUB_TOKEN (jeton d'accès Docker Hub).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: services/tournament-service, image: pokemon-tournament }
          - { dir: services/user-service, image: pokemon-user }
          - { dir: services/frontend, image: pokemon-frontend }
          - { dir: services/scraper, image: pokemon-scraper }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construire et publier
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.ref_name }}
        run: |
          IMAGE="${IMAGE/:v/:}"  # v0.1.0 -> 0.1.0
          docker build -t "$IMAGE" ${{ matrix.dir }}
          docker push "$IMAGE"
