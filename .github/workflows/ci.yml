name: CI

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
      - run: uvx ruff@0.16.8 check .
      - run: uvx ruff@0.16.8 format --check .
      - run: kubectl kustomize k8s > k8s.yaml  # manifestes Kubernetes bien formés, tels que déployés
      # Mauvaises configurations Kubernetes (Trivy) : échec sur toute alerte HIGH ou CRITICAL.
      - run: >-
          docker run --rm -v "$PWD/k8s.yaml:/k8s.yaml:ro" aquasec/trivy:0.74.0
          config --severity HIGH,CRITICAL --exit-code 1 /k8s.yaml
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
      - run: terraform -chdir=infra/gke fmt -check
      - run: terraform -chdir=infra/gke init -backend=false -input=false && terraform -chdir=infra/gke validate

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dir: [services/tournament-service, services/user-service, services/scraper, services/frontend]
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    # Base MySQL jetable pour les tests (mêmes valeurs que les défauts de tests/conftest.py).
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
          MYSQL_DATABASE: tournament_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -ptest"
          --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: 0.11.32
      - run: uv sync --frozen
      - run: uv run pytest
      - run: docker build -t image-ci .
      # Failles de l'image (Trivy) : échec sur une faille HIGH ou CRITICAL qui a un correctif, c'est-à-dire
      # qu'il suffit de reconstruire l'image ou de monter une dépendance. Les autres ne bloquent pas.
      - run: >-
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.74.0
          image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed --exit-code 1 image-ci

  # Déploie k8s/ sur un cluster jetable (kind) puis lance k8s/smoke-test.sh : pods prêts, gateway en HTTPS,
  # /internal/ fermé, NetworkPolicy, droits des comptes de service et Pod Security. kindnet applique les NetworkPolicy.
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Cluster kind
        run: |
          curl -sSLo kind https://github.com/kubernetes-sigs/kind/releases/download/v0.33.0/kind-linux-amd64
          echo "aee6151561422756b764a4ae28e7f44cda5af5a9eead3cc9985112b1de8d8e0d  kind" | sha256sum -c
          sudo install kind /usr/local/bin/kind
          kind create cluster --name pokemon --wait 120s
      - name: Gateway (même ingress-nginx que sur GKE)
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.15.1/deploy/static/provider/cloud/deploy.yaml
          kubectl -n ingress-nginx wait --for=condition=ready pod -l app.kubernetes.io/component=controller --timeout=300s
      - name: Images construites ici, aux noms et versions de k8s/kustomization.yaml
        run: |
          for pair in tournament:tournament-service user:user-service frontend:frontend scraper:scraper; do
            image=$(kubectl kustomize k8s | grep -m1 -o "[^ ]*/pokemon-${pair%%:*}:[^ ]*")
            docker build -t "$image" "services/${pair#*:}"
            kind load docker-image "$image" --name pokemon
          done
      - name: Secrets jetables et déploiement
        run: |
          kubectl apply -f k8s/namespace.yaml
          kubectl -n pokemon create secret generic app-secrets \
            --from-literal=MYSQL_ROOT_PASSWORD="$(openssl rand -hex 16)" \
            --from-literal=TOURNAMENT_DB_USER=tournament \
            --from-literal=TOURNAMENT_DB_PASSWORD="$(openssl rand -hex 16)" \
            --from-literal=USER_DB_USER=users \
            --from-literal=USER_DB_PASSWORD="$(openssl rand -hex 16)" \
            --from-literal=JWT_SECRET="$(openssl rand -hex 32)"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=pokemon.local" \
            -addext "subjectAltName=DNS:pokemon.local" -keyout tls.key -out tls.crt
          kubectl -n pokemon create secret tls pokemon-tls --cert=tls.crt --key=tls.key
          kubectl apply -k k8s/
      - run: k8s/smoke-test.sh
      - name: État du cluster en cas d'échec
        if: failure()
        run: |
          kubectl -n pokemon get pods,svc,endpointslices,networkpolicy
          kubectl -n pokemon get events --sort-by=.lastTimestamp | tail -30
          kubectl -n pokemon logs deploy/tournament-service --all-containers --tail=50 || true

  # Au push d'un tag v* (ex. v0.1.0), une fois lint, tests et déploiement verts : publie <compte>/pokemon-<service>:0.1.0.
  # Secrets GitHub à créer : DOCKERHUB_USERNAME (en minuscules) et DOCKERHUB_TOKEN (jeton d'accès Docker Hub).
  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, deploy]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { dir: services/tournament-service, image: pokemon-tournament }
          - { dir: services/user-service, image: pokemon-user }
          - { dir: services/frontend, image: pokemon-frontend }
          - { dir: services/scraper, image: pokemon-scraper }
    steps:
      - uses: actions/checkout@v4
      # Images pour amd64 (PC, GKE) et arm64 (Mac Apple Silicon, minikube compris) : chaque machine
      # tire la variante de son processeur. QEMU émule arm64 sur le runner, qui est en amd64.
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Construire et publier
        env:
          IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ github.ref_name }}
        run: |
          IMAGE="${IMAGE/:v/:}"  # v0.1.0 -> 0.1.0
          docker buildx build --platform linux/amd64,linux/arm64 -t "$IMAGE" --push ${{ matrix.dir }}
