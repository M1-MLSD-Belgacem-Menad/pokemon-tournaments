[project]
name = "tournament-service"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "pymysql>=1.2.3",
    "pyjwt",
    "uvicorn",
    "grpcio>=1.84.0",
    "grpcio-tools>=1.84.0",
]

[dependency-groups]
dev = ["pytest", "httpx2"]

[tool.pytest.ini_options]
pythonpath = ["."]
