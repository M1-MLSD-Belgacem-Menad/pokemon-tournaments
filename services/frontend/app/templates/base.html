<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Tournois Pokémon VGC{% endblock %}</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header>
    <a href="/">Tournois Pokémon VGC</a>
    <nav>
      <a href="/builder">Créer une équipe</a>
    {% if request.cookies.token %}
      <a href="/tournaments/new">Saisir un tournoi</a>
      <form method="post" action="/logout"><button>Déconnexion</button></form>
    {% else %}
      <a href="/login">Connexion</a>
      <a href="/register">Inscription</a>
    {% endif %}
    </nav>
  </header>
  <main>
    {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
