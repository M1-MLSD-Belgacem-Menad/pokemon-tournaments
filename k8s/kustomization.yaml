# Déploiement : kubectl apply -k k8s/  (voir le README pour le Secret à créer avant)
namespace: pokemon
resources:
  - namespace.yaml
  - mysql/pvc.yaml
  - mysql/deployment.yaml
  - mysql/service.yaml
  - tournament/deployment.yaml
  - tournament/service.yaml
  - user/deployment.yaml
  - user/service.yaml
  - frontend/deployment.yaml
  - frontend/service.yaml
  - ingress.yaml
  - scraper/cronjob.yaml
# Même script d'initialisation que Compose (k8s/mysql/initdb/).
configMapGenerator:
  - name: mysql-initdb
    files:
      - mysql/initdb/user-db.sh
# Seul endroit où changer le compte Docker Hub et la version des images.
images:
  - name: pokemon-tournament
    newName: menadacheraiou/pokemon-tournament
    newTag: "0.1.0"
  - name: pokemon-frontend
    newName: menadacheraiou/pokemon-frontend
    newTag: "0.1.0"
  - name: pokemon-scraper
    newName: menadacheraiou/pokemon-scraper
    newTag: "0.1.0"
  - name: pokemon-user
    newName: menadacheraiou/pokemon-user
    newTag: "0.1.0"
