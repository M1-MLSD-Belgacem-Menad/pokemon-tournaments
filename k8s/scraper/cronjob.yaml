# Scraping quotidien. Lancement à la main : kubectl -n pokemon create job --from=cronjob/scraper test
apiVersion: batch/v1
kind: CronJob
metadata:
  name: scraper
spec:
  schedule: "0 6 * * *"
  timeZone: Europe/Paris
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 0  # pas de relance : un tournoi en erreur le restera, le passage du lendemain suffit
      template:
        metadata:
          labels:
            app: scraper  # autorisé à appeler le tournament-service (k8s/network-policies.yaml)
        spec:
          restartPolicy: Never
          serviceAccountName: scraper
          automountServiceAccountToken: false  # aucun service n'appelle l'API Kubernetes
          securityContext:
            runAsNonRoot: true
            runAsUser: 65534  # nobody, comme le USER des Dockerfiles
            seccompProfile: { type: RuntimeDefault }
          containers:
            - name: scraper
              image: pokemon-scraper  # compte et version : k8s/kustomization.yaml
              securityContext:
                allowPrivilegeEscalation: false
                capabilities: { drop: [ALL] }
              env:
                # Appel par le nom DNS interne du Service, sans passer par l'Ingress.
                - name: TOURNAMENT_API_URL
                  value: http://tournament-service:8000
                - name: TOURNAMENT_GRPC_TARGET
                  value: tournament-service:50051
                # Assez large pour couvrir une journée de tournois : ceux commencés depuis moins de 24 h
                # sont ignorés et repris le lendemain, ceux déjà en base sont ignorés par l'import.
                - name: SCRAPE_LIMIT
                  value: "30"
