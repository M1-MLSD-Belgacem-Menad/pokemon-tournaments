apiVersion: apps/v1
kind: Deployment
metadata:
  name: tournament-service
spec:
  replicas: 2  # sans état ; les migrations au démarrage sont protégées par un verrou MySQL
  selector:
    matchLabels:
      app: tournament-service
  template:
    metadata:
      labels:
        app: tournament-service
    spec:
      serviceAccountName: tournament-service
      automountServiceAccountToken: false  # aucun service n'appelle l'API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody, comme le USER des Dockerfiles
        seccompProfile: { type: RuntimeDefault }
      # Attend que MySQL soit prêt (le Service n'a d'adresse qu'une fois sa readinessProbe OK),
      # sinon le service plante au démarrage et Kubernetes espace de plus en plus les redémarrages.
      initContainers:
        - name: wait-mysql
          image: pokemon-tournament
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          command:
            - .venv/bin/python
            - -c
            - |
              import socket, time
              while True:
                  try:
                      socket.create_connection(("mysql", 3306), timeout=2).close()
                      break
                  except OSError:
                      time.sleep(2)
      containers:
        - name: tournament-service
          image: pokemon-tournament  # compte et version : k8s/kustomization.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_NAME
              value: tournament_db
            - name: DB_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: TOURNAMENT_DB_USER }
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: TOURNAMENT_DB_PASSWORD }
            # Même clé que le user-service : vérifie les jetons des tournois saisis.
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: app-secrets, key: JWT_SECRET }
          ports:
            - { name: http, containerPort: 8000 }
            - { name: grpc, containerPort: 50051 }  # import des tournois par le scraper
          # Les migrations tournent au démarrage : la liveness n'agit qu'une fois /health joignable,
          # pour ne pas tuer un pod au milieu d'une migration (DDL MySQL non atomique).
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
            failureThreshold: 36  # 3 minutes
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
