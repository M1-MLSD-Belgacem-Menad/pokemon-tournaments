apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      serviceAccountName: frontend
      automountServiceAccountToken: false  # aucun service n'appelle l'API Kubernetes
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534  # nobody, comme le USER des Dockerfiles
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: frontend
          image: pokemon-frontend  # compte et version : k8s/kustomization.yaml
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: TOURNAMENT_API_URL
              value: http://tournament-service:8000
            - name: USER_API_URL
              value: http://user-service:8000
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
