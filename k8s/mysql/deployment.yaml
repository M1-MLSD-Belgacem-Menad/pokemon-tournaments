# Le Secret "app-secrets" n'est pas dans le dépôt : il se crée à la main depuis .env (voir le README).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  strategy:
    type: Recreate  # le volume ReadWriteOnce ne peut pas être monté par deux pods à la fois
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      serviceAccountName: mysql
      automountServiceAccountToken: false
      # Lancée directement sous l'utilisateur mysql de l'image (999) : sans root, l'entrypoint saute
      # le chown et le changement d'utilisateur. Requis par le profil Pod Security « restricted ».
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999  # volume au groupe mysql, quand le stockage le permet (disque GKE)
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: mysql
          image: mysql:8.4
          # Tables temporaires internes (GROUP BY des statistiques) : jusqu'à 1 Go en mémoire par défaut,
          # toute la limite du conteneur. Au-delà de 128 Mo, MySQL les passe sur disque.
          args: ["--temptable-max-ram=128M"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          # Mesures sur minikube avec 25 tournois : pic de 462 Mo, d'où une limite à un peu plus du double.
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 1, memory: 1Gi }
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: MYSQL_ROOT_PASSWORD }
            # Crée tournament_db et un compte qui n'a de droits que sur elle (comme dans Compose).
            - name: MYSQL_DATABASE
              value: tournament_db
            - name: MYSQL_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: TOURNAMENT_DB_USER }
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: TOURNAMENT_DB_PASSWORD }
            # Lus par initdb/user-db.sh, qui crée user_db et son compte.
            - name: USER_DB_USER
              valueFrom:
                secretKeyRef: { name: app-secrets, key: USER_DB_USER }
            - name: USER_DB_PASSWORD
              valueFrom:
                secretKeyRef: { name: app-secrets, key: USER_DB_PASSWORD }
          ports:
            - containerPort: 3306
          readinessProbe:
            exec:
              command: ["sh", "-c", "MYSQL_PWD=\"$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -uroot"]
            periodSeconds: 5
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            # Système de fichiers en lecture seule : socket et pid, fichiers temporaires, dossier d'export.
            - { name: run, mountPath: /var/run/mysqld }
            - { name: tmp, mountPath: /tmp }
            - { name: files, mountPath: /var/lib/mysql-files }
      volumes:
        - name: initdb
          configMap:
            name: mysql-initdb
        - { name: run, emptyDir: {} }
        - { name: tmp, emptyDir: {} }
        - { name: files, emptyDir: {} }
        - name: data
          persistentVolumeClaim:
            claimName: mysql-data
