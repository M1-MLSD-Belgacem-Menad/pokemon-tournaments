# Trafic entrant refusé par défaut ; chaque règle ouvre un seul chemin.
# Le trafic sortant reste libre (le scraper appelle Limitless sur Internet, tous font du DNS).
# Appliquées seulement si le réseau du cluster les gère : minikube start --cni=calico.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# Chaque service ne parle qu'à sa base, mais les deux bases sont dans le même MySQL.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mysql
spec:
  podSelector:
    matchLabels: { app: mysql }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: tournament-service }
        - podSelector:
            matchLabels: { app: user-service }
      ports:
        - port: 3306
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: tournament-service
spec:
  podSelector:
    matchLabels: { app: tournament-service }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: frontend }
        - podSelector:
            matchLabels: { app: scraper }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - port: 8000
    # gRPC : seul le scraper importe des tournois.
    - from:
        - podSelector:
            matchLabels: { app: scraper }
      ports:
        - port: 50051
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: user-service
spec:
  podSelector:
    matchLabels: { app: user-service }
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: frontend }
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend
spec:
  podSelector:
    matchLabels: { app: frontend }
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: ingress-nginx }
      ports:
        - port: 8000
